name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker images
        uses: docker/bake-action@v4
        with:
          push: true

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Check if the project directory exists in the home folder; if not, create it and clone the repository
            if [ ! -d ~/lab/docker-lab ]; then
              mkdir -p ~/lab
              git clone https://github.com/${{ github.repository }}.git ~/lab/docker-lab
            fi
            
            # Navigate to the project directory, pull the latest code, update Docker images, and restart containers safely
            cd ~/lab/docker-lab
            git pull origin main
            docker compose pull
            docker compose up -d --remove-orphans
